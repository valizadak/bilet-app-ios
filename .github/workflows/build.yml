# Pulsuz kompilyasiya yoxlaması.
# Məqsəd: Mac icarəyə götürməzdən əvvəl bütün Swift səhvlərini aşkarlamaq.
# Simulyator üçün yığır, imzalama tələb etmir — Apple hesabı lazım deyil.

name: iOS yigma yoxlamasi

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Kodu goturur
        uses: actions/checkout@v4

      - name: Ruby ve gem-ler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Homebrew asililiqlari (xcodegen, needle)
        run: brew bundle

      - name: CocoaPods kesi
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ hashFiles('podfile.json', 'Podfile.lock') }}
          restore-keys: pods-

      # Konfiquratorun hansi girisden narazi qaldigini tapmaq ucun
      # variantlari yan-yana sinayiriq. Sebeb tapilandan sonra silinecek.
      - name: Diaqnostika
        run: |
          set +e
          CFG=Scripts/project_configurator/project_configurator
          chmod +x "$CFG"
          curl -sSL -o /tmp/upstream-configuration.json \
            https://raw.githubusercontent.com/travelpayouts/white-label-app-ios/main/configuration.json
          echo "upstream config alindi: $(wc -c < /tmp/upstream-configuration.json) bayt"
          cp -R Resources/Strings/WhiteLabel /tmp/wl-no-az
          rm -rf /tmp/wl-no-az/az.lproj
          echo "az-siz strings dir hazir: $(ls /tmp/wl-no-az | tr '\n' ' ')"

          try () {
            local name="$1" cfg="$2" dir="$3"
            rm -rf /tmp/out && mkdir -p /tmp/out/gen /tmp/out/xc /tmp/out/ent /tmp/out/pod
            echo "===== $name ====="
            "$CFG" --configuration-input "$cfg" --podfile-input podfile.json \
              --configurator-output /tmp/out/gen --podfile-output /tmp/out/pod \
              --xc-config-output /tmp/out/xc --entitlements-output /tmp/out/ent \
              --info-plist-strings-dir "$dir" --is-production true \
              --product-version 1.8.0 --project-yaml-path project.yml
            echo ">>> $name netice: $?"
            echo
          }

          try "A: upstream config + az-siz strings" /tmp/upstream-configuration.json /tmp/wl-no-az
          try "B: bizim config + az-siz strings"    configuration.json               /tmp/wl-no-az
          try "C: bizim config + bizim strings"     configuration.json               Resources/Strings/WhiteLabel
          try "D: upstream config + bizim strings"  /tmp/upstream-configuration.json Resources/Strings/WhiteLabel
          exit 0

      - name: Konfiqurasiya, layihe generasiyasi ve podlar
        run: bundle exec fastlane setup

      - name: Yigma (simulyator, imzalamasiz)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace travel-app.xcworkspace \
            -scheme debug \
            -configuration debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Sehv jurnallarini saxlayir
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            *.log
          if-no-files-found: ignore
