# Pulsuz kompilyasiya yoxlaması.
# Məqsəd: Mac icarəyə götürməzdən əvvəl bütün Swift səhvlərini aşkarlamaq.
# Simulyator üçün yığır, imzalama tələb etmir — Apple hesabı lazım deyil.

name: iOS yigma yoxlamasi

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Kodu goturur
        uses: actions/checkout@v4

      # XcodeGen layiheni yeni formatda yaradir, kohne Xcode onu aca bilmir.
      # Ona gore movcud en yeni Xcode secilir.
      - name: En yeni Xcode secilir
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$NEWEST" ] && NEWEST=/Applications/Xcode.app
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Ruby ve gem-ler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Homebrew asililiqlari (xcodegen, needle)
        run: brew bundle

      - name: CocoaPods kesi
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ hashFiles('podfile.json', 'Podfile.lock') }}
          restore-keys: pods-

      - name: Konfiqurasiya, layihe generasiyasi ve podlar
        run: bundle exec fastlane setup

      - name: Yigma (simulyator, imzalamasiz)
        run: |
          set -o pipefail
          echo "=== movcud sxemler ve konfiqurasiyalar ==="
          xcodebuild -workspace travel-app.xcworkspace -list

          # Sxem adi layihe generasiyasindan asili oldugu ucun avtomatik secirik:
          # "debug" varsa onu, yoxsa tetbiqin oz adini, o da yoxsa birincini.
          SCHEMES=$(xcodebuild -workspace travel-app.xcworkspace -list -json | jq -r '.workspace.schemes[]')
          SCHEME=$(echo "$SCHEMES" | grep -ix "debug" | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | grep -i "travel-app" | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | head -1)
          echo "=== secilen sxem: $SCHEME ==="

          xcodebuild \
            -workspace travel-app.xcworkspace \
            -scheme "$SCHEME" \
            -configuration debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # Tetbiqi simulyatorda acib ekran sekli cekirik — Mac icare etmeden
      # gorunusu yoxlamaq ucun yegane yol budur.
      - name: Simulyatorda ekran sekilleri
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -1)
          echo "tetbiq: $APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "bundle id: $BUNDLE"

          # Movcud cihaz tipini secirik: en boyuk iPhone, yoxsa istenilen iPhone
          DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[].identifier' \
            | grep -E "iPhone-16-Pro-Max|iPhone-16-Pro|iPhone-16|iPhone-15-Pro-Max" | head -1)
          [ -z "$DEVTYPE" ] && DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[].identifier' | grep iPhone | tail -1)
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable) | .identifier' | grep iOS | tail -1)
          echo "cihaz: $DEVTYPE / $RUNTIME"

          UDID=$(xcrun simctl create bilet-test "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          # Bildiris icazesi pencersi ekranin ortasini ortur — evvelceden
          # cavablandirmaga calisiriq (Xcode versiyasindan asili olaraq
          # desteklenmeye biler, ona gore sehv gozardi edilir).
          xcrun simctl privacy "$UDID" grant all "$BUNDLE" 2>/dev/null || true

          mkdir -p ekranlar
          xcrun simctl launch "$UDID" "$BUNDLE" -AppleLanguages "(az)" -AppleLocale az_AZ || true

          # Tetbiq acilib melumat yuklediyi ucun bir nece anda cekirik
          for t in 8 16 26 40; do
            sleep 8
            xcrun simctl io "$UDID" screenshot "ekranlar/ekran-${t}san.png" || true
            echo "cekildi: ${t} saniye"
          done

          ls -la ekranlar

      - name: Ekran sekillerini saxlayir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-sekilleri
          path: ekranlar/
          if-no-files-found: warn

      - name: Sehv jurnallarini saxlayir
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            *.log
          if-no-files-found: ignore
